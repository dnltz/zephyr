description: TI Keystone GPIO node

compatible: "ti,keystone-gpio"

include: [gpio-controller.yaml, base.yaml]

properties:
  reg:
    required: true

  interrupts:
    required: true

gpio-cells:
  - pin
  - flags

interrupt-cells:
  - irq
  - priority
